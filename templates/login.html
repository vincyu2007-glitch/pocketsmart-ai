{% extends "base.html" %}
{% block title %}Sign in - PocketSmart AI{% endblock %}

{% block content %}
<section class="container narrow">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to build plans and keep your history.</p>

    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" class="form" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email"
             value="{{ form.email or '' }}" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             placeholder="At least 8 characters">

      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>

    <div class="divider"><span>or</span></div>

    <form method="post" action="{{ url_for('web.demo_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-outline btn-block" type="submit">Explore with the demo account</button>
    </form>

    <p class="muted center">New here? <a href="{{ url_for('web.register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
