{% extends "base.html" %}
{% block title %}{{ code }} - PocketSmart AI{% endblock %}

{% block content %}
<section class="container narrow section center-block">
  <div class="card auth-card">
    <p class="error-code">{{ code }}</p>
    <h1>{{ {400: 'Bad request', 404: 'Page not found', 429: 'Slow down a little', 500: 'Something broke'}.get(code, 'Error') }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('web.index') }}">Back home</a>
  </div>
</section>
{% endblock %}
